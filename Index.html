<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hassan Black Music</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* CSS Variables - Black & Grey Theme */
        :root {
            --desktop-bg: hsl(0, 0%, 0%);
            --taskbar-bg: hsl(0, 0%, 10%);
            --window-bg: hsl(0, 0%, 15%);
            --window-border: hsl(0, 0%, 30%);
            --window-title-bg: hsl(0, 0%, 20%);
            --window-title-text: hsl(0, 0%, 100%);
            --text-primary: hsl(0, 0%, 100%);
            --text-secondary: hsl(0, 0%, 80%);
            --text-muted: hsl(0, 0%, 60%);
            --button-bg: hsl(0, 0%, 25%);
            --button-hover: hsl(0, 0%, 35%);
            --button-active: hsl(0, 0%, 20%);
            --accent-color: hsl(340, 65%, 50%);
            --accent-hover: hsl(340, 75%, 60%);
            --border-light: hsl(0, 0%, 40%);
            --border-dark: hsl(0, 0%, 25%);
            --shadow-color: hsl(0, 0%, 10%);
            --primary-glow: hsl(340, 75%, 70%);
        }

        body {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.4;
            color: var(--text-primary);
            background: var(--desktop-bg);
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }

        /* Desktop */
        .os-desktop {
            min-height: 100vh;
            background: var(--desktop-bg);
            position: relative;
            background-image: 
                radial-gradient(circle at 25% 25%, transparent 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, transparent 0%, transparent 50%);
        }

        /* Taskbar */
        .os-taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 32px;
            background: var(--taskbar-bg);
            border-top: 2px solid var(--border-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            box-shadow: inset 0 1px 0 var(--border-light);
            z-index: 1000;
        }

        /* Windows */
        .os-window {
            position: fixed;
            background: var(--window-bg);
            border: 2px solid var(--window-border);
            min-width: 300px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .os-window-title {
            background: var(--window-title-bg);
            color: var(--window-title-text);
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: move;
            user-select: none;
        }

        .os-window-content {
            flex: 1;
            padding: 12px;
            overflow: auto;
            background: var(--window-bg);
        }

        /* Buttons */
        .os-button {
            padding: 4px 12px;
            background: var(--button-bg);
            border: 1px solid var(--border-dark);
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            box-shadow: inset 1px 1px 0 var(--border-light);
            font-family: inherit;
        }

        .os-button:hover {
            background: var(--button-hover);
        }

        .os-button:active {
            background: var(--button-active);
            box-shadow: inset 1px 1px 2px var(--border-dark);
        }

        .os-button-accent {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .os-button-accent:hover {
            background: var(--accent-hover);
        }

        /* Icons */
        .os-icon {
            width: 64px;
            height: 64px;
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }

        .os-icon:hover {
            background: var(--button-hover);
            box-shadow: 0 0 10px hsla(340, 75%, 70%, 0.5);
        }

        .os-icon:active {
            background: var(--button-active);
        }

        /* Text Styles */
        .os-text-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-primary);
        }

        .os-text-body {
            font-size: 12px;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .os-text-muted {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Input */
        .os-input {
            padding: 4px 8px;
            border: 1px solid var(--border-dark);
            background: var(--window-bg);
            color: var(--text-primary);
            font-size: 12px;
            box-shadow: inset 1px 1px 2px var(--border-dark);
            font-family: inherit;
        }

        /* Menu */
        .os-menu {
            background: var(--window-bg);
            border: 1px solid var(--border-dark);
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .os-menu-item {
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
        }

        .os-menu-item:hover {
            background: var(--button-hover);
        }

        /* Scrollbar */
        .os-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: var(--border-dark) var(--window-bg);
        }

        .os-scrollbar::-webkit-scrollbar {
            width: 12px;
        }

        .os-scrollbar::-webkit-scrollbar-track {
            background: var(--window-bg);
        }

        .os-scrollbar::-webkit-scrollbar-thumb {
            background: var(--border-dark);
            border: 1px solid var(--border-light);
        }

        /* Iframe */
        .os-iframe {
            border: 1px solid var(--border-dark);
            background: var(--window-bg);
        }

        /* Pixel Effects */
        .pixel-text {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            text-shadow: 1px 1px 0 var(--shadow-color);
            transition: all 0.2s;
        }

        .pixel-text:hover {
            transform: scale(1.02);
            text-shadow: 2px 2px 0 var(--shadow-color);
        }

        /* Utility Classes */
        .hidden { display: none; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .gap-1 { gap: 4px; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .gap-4 { gap: 16px; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .cursor-pointer { cursor: pointer; }
        .cursor-move { cursor: move; }
        .select-none { user-select: none; }
        .absolute { position: absolute; }
        .relative { position: relative; }
        .fixed { position: fixed; }
        .mb-2 { margin-bottom: 8px; }
        .mb-4 { margin-bottom: 16px; }
        .mt-4 { margin-top: 16px; }
        .p-2 { padding: 8px; }
        .p-3 { padding: 12px; }
        .p-4 { padding: 16px; }
        .px-2 { padding-left: 8px; padding-right: 8px; }
        .py-1 { padding-top: 4px; padding-bottom: 4px; }
        .border-t { border-top: 1px solid var(--border-dark); }
        .border-r { border-right: 1px solid var(--border-dark); }
        .space-y-1 > * + * { margin-top: 4px; }
        .space-y-2 > * + * { margin-top: 8px; }
        .max-h-64 { max-height: 256px; }
        .overflow-y-auto { overflow-y: auto; }
        .z-10 { z-index: 10; }
        .z-50 { z-index: 50; }
        .z-1000 { z-index: 1000; }

        /* Desktop Title */
        .desktop-title {
            position: absolute;
            top: 16px;
            right: 16px;
            text-align: right;
        }

        .desktop-title h1 {
            font-family: 'Inter', sans-serif;
            font-size: 32px;
            font-weight: 600;
            color: var(--text-primary);
            text-shadow: 1px 1px 0 var(--shadow-color);
            margin-bottom: 4px;
        }

        .desktop-subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Social Links */
        .social-links {
            position: absolute;
            bottom: 40px;
            right: 16px;
        }

        /* Logo Background */
        .logo-bg {
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="%23222"/><text x="100" y="100" text-anchor="middle" dominant-baseline="middle" fill="%23666" font-size="24">LOGO</text></svg>');
            background-size: 200px;
            background-position: bottom right;
            background-repeat: no-repeat;
            background-blend-mode: overlay;
        }
    
        /* Mobile responsive OS */
        @media (max-width: 768px) {
            body { overflow:hidden; }
            .desktop-title {
                top: 8px;
                right: 8px;
                left: 8px;
                text-align: center;
            }
            .desktop-title h1 { font-size: 22px; }
            .desktop-subtitle { font-size: 11px; }
            .social-links {
                right: 8px;
                bottom: 40px;
                transform: scale(0.9);
                transform-origin: bottom right;
            }
            .os-window {
                min-width: 0 !important;
                width: calc(100vw - 16px) !important;
                max-width: calc(100vw - 16px) !important;
                height: calc(100vh - 56px) !important;
                left: 8px !important;
                top: 8px !important;
            }
        }

</style>
</head>

    <script>
        // Global variables
        let windows = {};
        let highestZIndex = 10;
        let draggedElement = null;
        let dragOffset = { x: 0, y: 0 };

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateClock();
            setInterval(updateClock, 1000);
            
            // Make icons draggable
            makeIconsDraggable();
            
            // Add icon click handlers
            document.getElementById('musicIcon').onclick = () => openWindow('music');
            document.getElementById('videosIcon').onclick = () => openWindow('videos');
            document.getElementById('artistsIcon').onclick = () => openWindow('artists');
            document.getElementById('gamesIcon').onclick = () => openWindow('games');
            
            // Click outside to close start menu
            document.addEventListener('click', function(e) {
                const startMenu = document.getElementById('startMenu');
                const startButton = e.target.closest('.os-button-accent');
                if (!startMenu.contains(e.target) && !startButton) {
                    startMenu.classList.add('hidden');
                }
            });
        });

        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        // Start Menu
        function toggleStartMenu() {
            const startMenu = document.getElementById('startMenu');
            startMenu.classList.toggle('hidden');
        }

        // Window Management
        function openWindow(windowId) {
            if (windows[windowId]) {
                focusWindow(windowId);
                return;
            }

            const positions = {
                music: { x: 100, y: 60 },
                videos: { x: 150, y: 80 },
                artists: { x: 200, y: 100 },
                games: { x: 250, y: 120 }
            };

            const sizes = {
                music: { width: 700, height: 500 },
                videos: { width: 650, height: 450 },
                artists: { width: 600, height: 500 },
                games: { width: 400, height: 300 }
            };

            const titles = {
                music: 'Music Library - Madd\'Shiid Records',
                videos: 'Video Player - Madd\'Shiid Records',
                artists: 'Artists & Information - Madd\'Shiid Records',
                games: 'Game Center - Madd\'Shiid Records'
            };

            const content = {
                music: getMusicContent(),
                videos: getVideosContent(),
                artists: getArtistsContent(),
                games: getGamesContent()
            };

            const windowElement = createWindow(windowId, titles[windowId], content[windowId], positions[windowId], sizes[windowId]);
            document.getElementById('desktop').appendChild(windowElement);
            
            windows[windowId] = windowElement;
            
            // Show taskbar button
            const taskbarBtn = document.getElementById(windowId + 'TaskbarBtn');
            if (taskbarBtn) {
                taskbarBtn.style.display = 'flex';
                taskbarBtn.classList.remove('hidden');
            }
            
            focusWindow(windowId);
            
            // Hide start menu
            document.getElementById('startMenu').classList.add('hidden');
        }

        function createWindow(id, title, content, position, size) {
            const windowEl = document.createElement('div');
            windowEl.className = 'os-window';
            windowEl.id = id + 'Window';
            windowEl.style.left = position.x + 'px';
            windowEl.style.top = position.y + 'px';
            windowEl.style.width = size.width + 'px';
            windowEl.style.height = size.height + 'px';
            windowEl.style.zIndex = ++highestZIndex;

            windowEl.innerHTML = `
                <div class="os-window-title" onmousedown="startDrag(event, '${id}')">
                    <span>${title}</span>
                    <div class="flex items-center gap-1">

        function closeWindow(windowId) {
            const windowEl = windows[windowId];
            if (windowEl) {
                windowEl.remove();
                delete windows[windowId];
                
                // Hide taskbar button
                const taskbarBtn = document.getElementById(windowId + 'TaskbarBtn');
                if (taskbarBtn) {
                    taskbarBtn.style.display = 'none';
                    taskbarBtn.classList.add('hidden');
                }
            }
        }

        function minimizeWindow(windowId) {
            const windowEl = windows[windowId];
            if (windowEl) {
                windowEl.style.display = 'none';
            }
        }

        function focusWindow(windowId) {
            const windowEl = windows[windowId];
            if (windowEl) {
                if (windowEl.style.display === 'none') {
                    windowEl.style.display = 'flex';
                }
                windowEl.style.zIndex = ++highestZIndex;
                
                // Update taskbar button state
                document.querySelectorAll('[id$="TaskbarBtn"]').forEach(btn => {
                    btn.style.background = '';
                });
                const taskbarBtn = document.getElementById(windowId + 'TaskbarBtn');
                if (taskbarBtn) {
                    taskbarBtn.style.background = 'var(--button-active)';
                }
            }
        }

        // Drag functionality
        function startDrag(e, windowId) {
            e.preventDefault();
            draggedElement = windows[windowId];
            const rect = draggedElement.getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left;
            dragOffset.y = e.clientY - rect.top;
            
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDrag);
        }

        function drag(e) {
            if (draggedElement) {
                draggedElement.style.left = (e.clientX - dragOffset.x) + 'px';
                draggedElement.style.top = (e.clientY - dragOffset.y) + 'px';
            }
        }

        function stopDrag() {
            draggedElement = null;
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('mouseup', stopDrag);
        }

            const icons = ['musicIcon', 'videosIcon', 'artistsIcon', 'gamesIcon'];
            icons.forEach(iconId => {
                const icon = document.getElementById(iconId);
                let isDragging = false;
                let startPos = { x: 0, y: 0 };
                
                icon.onmousedown = function(e) {
                    isDragging = true;
                    startPos.x = e.clientX - parseInt(icon.style.left || 0);
                    startPos.y = e.clientY - parseInt(icon.style.top || 0);
                    e.preventDefault();
                };
                
                document.onmousemove = function(e) {
                    if (isDragging && e.target.closest('#' + iconId)) {
                        icon.style.left = (e.clientX - startPos.x) + 'px';
                        icon.style.top = (e.clientY - startPos.y) + 'px';
                    }
                };
                
                document.onmouseup = function() {
                    isDragging = false;
                };
            });
        }

// Mobile touch drag + double tap maximize/restore
let lastTapTime = 0;

function toggleMaximize(windowId){
    const win = windows[windowId];
    if(!win) return;

    if(win.dataset.maximized === "true"){
        win.style.left = win.dataset.prevLeft;
        win.style.top = win.dataset.prevTop;
        win.style.width = win.dataset.prevWidth;
        win.style.height = win.dataset.prevHeight;
        win.dataset.maximized = "false";
    } else {
        win.dataset.prevLeft = win.style.left;
        win.dataset.prevTop = win.style.top;
        win.dataset.prevWidth = win.style.width;
        win.dataset.prevHeight = win.style.height;

        win.style.left = "0px";
        win.style.top = "0px";
        win.style.width = window.innerWidth + "px";
        win.style.height = (window.innerHeight - 32) + "px";
        win.dataset.maximized = "true";
    }
}

const originalCreateWindow = createWindow;
createWindow = function(id,title,content,position,size){
    const w = originalCreateWindow(id,title,content,position,size);

    const titleBar = w.querySelector('.os-window-title');

    titleBar.addEventListener('dblclick', () => toggleMaximize(id));

    titleBar.addEventListener('touchstart', function(e){
        const now = Date.now();
        if(now - lastTapTime < 300){
            toggleMaximize(id);
        }
        lastTapTime = now;

        const touch = e.touches[0];
        draggedElement = w;
        const rect = w.getBoundingClientRect();
        dragOffset.x = touch.clientX - rect.left;
        dragOffset.y = touch.clientY - rect.top;
    }, {passive:true});

    titleBar.addEventListener('touchmove', function(e){
        if(!draggedElement) return;
        const touch = e.touches[0];
        draggedElement.style.left = (touch.clientX - dragOffset.x) + 'px';
        draggedElement.style.top = (touch.clientY - dragOffset.y) + 'px';
    }, {passive:true});

    titleBar.addEventListener('touchend', function(){
        draggedElement = null;
    });

    return w;
};
