    html, body {

    #homepage, #game-container {

    .controls {

    footer {

    #sc-player-wrapper {

      margin-top: 10px;

    #game-container h1 {

      margin: 4px 0 8px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #game-container h1 svg {
      width: 28px;
      height: 28px;
    }
    #game-over-popup {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #game-over-popup .popup-content {
      background: #000814;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 0 20px #00ffff;
    }
    #game-over-popup p {
      color: #00ffff;
      font-size: 18px;
      margin: 0 0 10px 0;
    }
    .button-row {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .button-row button {
      margin: 0 5px;
    }
  </style>

  <!-- Audio -->
 <audio id="click-sound" preload="auto" src="abos/click.mp3"></audio>
<audio id="eat-sound" preload="auto" src="abos/eat.mp3"></audio>
<audio id="dead-sound" preload="auto" src="abos/dead.mp3"></audio>
  <audio id="bg-music" src="bg-music.mp3" loop></audio>

  <script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scale = 20;
  const rows = canvas.height / scale;
  const columns = canvas.width / scale;
  let snake, food, score = 0, running = false, gameLoop;
  let highScore = localStorage.getItem('highScore') || 0;
  const eatSound = document.getElementById('eat-sound');
  const deadSound = document.getElementById('dead-sound');
  const clickSound = document.getElementById('click-sound');

  function startGame() {
    clickSound.play();
    document.getElementById('bg-music').play().catch(err => {});
    document.getElementById('homepage').style.display = 'none';
document.getElementById('top-title').style.display = 'none';
    document.getElementById('game-container').style.display = 'flex';
  }

  function togglePause() {
    try { clickSound.play(); } catch (e) { console.log("Click sound failed", e); }
    if (!snake) {
      snake = new Snake();
      food = randomFood();
      score = 0;
      updateScore();
    }
    if (running) clearInterval(gameLoop);
    else gameLoop = setInterval(runGame, 150);
    running = !running;
  }

  function updateScore() {
    const lastScore = localStorage.getItem('lastScore') || 0;
    document.getElementById('score').innerText =
      `Score: ${score} | High Score: ${highScore} | Last: ${lastScore}`;
  }

  function randomFood() {
    const x = Math.floor(Math.random() * columns) * scale;
    const y = Math.floor(Math.random() * rows) * scale;
    return { x, y };
  }

  function Snake() {
    this.x = 0; this.y = 0;
    this.xSpeed = scale; this.ySpeed = 0;
    this.total = 0; this.tail = [];

    this.draw = function () {
      ctx.fillStyle = "#00ffff";
      for (let i = 0; i < this.tail.length; i++)
        drawRoundedRect(ctx, this.tail[i].x, this.tail[i].y, scale, scale, 5);
      drawRoundedRect(ctx, this.x, this.y, scale, scale, 5);
    };

    this.update = function () {
      for (let i = 0; i < this.tail.length - 1; i++)
        this.tail[i] = this.tail[i + 1];
      if (this.total >= 1)
        this.tail[this.total - 1] = { x: this.x, y: this.y };
      this.x += this.xSpeed; this.y += this.ySpeed;
      if (this.x >= canvas.width) this.x = 0;
      if (this.y >= canvas.height) this.y = 0;
      if (this.x < 0) this.x = canvas.width - scale;
      if (this.y < 0) this.y = canvas.height - scale;
    };

    this.changeDirection = function (dir) {
      if (dir === "Up" && this.ySpeed === 0) { this.xSpeed = 0; this.ySpeed = -scale; }
      else if (dir === "Down" && this.ySpeed === 0) { this.xSpeed = 0; this.ySpeed = scale; }
      else if (dir === "Left" && this.xSpeed === 0) { this.xSpeed = -scale; this.ySpeed = 0; }
      else if (dir === "Right" && this.xSpeed === 0) { this.xSpeed = scale; this.ySpeed = 0; }
    };

    this.eat = function (food) {
      if (this.x === food.x && this.y === food.y) {
        try { eatSound.play(); } catch (e) { console.log("Eat sound failed", e); } this.total++; return true;
      }
      return false;
    };

    this.checkCollision = function () {
      for (let i = 0; i < this.tail.length; i++) {
        if (this.x === this.tail[i].x && this.y === this.tail[i].y) {
          try { deadSound.play(); } catch (e) { console.log("Dead sound failed", e); }
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('highScore', highScore);
          }
          localStorage.setItem('lastScore', score);
          this.total = 0;
          this.tail = [];
          score = 0;
          updateScore();
          showGameOver();
        }
      }
    };
  }

  function drawRoundedRect(ctx, x, y, width, height, radius) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
    ctx.fill();
  }

  function showGameOver() {
    clearInterval(gameLoop);
    running = false;
    document.getElementById('game-over-popup').style.display = 'flex';
  }

  let powerUp = null;
  let enemy = null;
  let enemySnake = null;
  let enemySnakeDir = { x: 1, y: 0 };

  function spawnPowerUp() {
    powerUp = { x: Math.floor(Math.random() * columns) * scale, y: Math.floor(Math.random() * rows) * scale };
    setTimeout(() => powerUp = null, 8000);
  }
  setInterval(spawnPowerUp, 60000);

  function spawnEnemy() {
    enemy = { x: Math.floor(Math.random() * columns) * scale, y: Math.floor(Math.random() * rows) * scale };
    setTimeout(() => enemy = null, 10000);
  }
  setInterval(spawnEnemy, 35000);

  function spawnEnemySnake() {
    enemySnake = {
      x: Math.floor(Math.random() * columns) * scale,
      y: Math.floor(Math.random() * rows) * scale,
      trail: [],
      length: 3
    };
    enemySnakeDir = { x: 1, y: 0 };
    setTimeout(() => enemySnake = null, 10000);
  }
  setInterval(spawnEnemySnake, 35000);

  runGame = function () {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    snake.update();
    snake.draw();

    // Draw food
    ctx.fillStyle = "#ff0000";
    ctx.beginPath();
    ctx.arc(food.x + scale / 2, food.y + scale / 2, scale / 2 - 2, 0, 2 * Math.PI);
    ctx.fill();

    if (snake.eat(food)) {
      food = randomFood();
      score++;
      updateScore();
    }

    // Power-up
    if (powerUp) {
      ctx.fillStyle = "#00ff00";
      ctx.beginPath();
      ctx.arc(powerUp.x + scale / 2, powerUp.y + scale / 2, scale / 2 - 4, 0, 2 * Math.PI);
      ctx.fill();

      if (snake.x === powerUp.x && snake.y === powerUp.y) {
        powerUp = null;
        score += 5;
        updateScore();
      }
    }

    // Enemy block
    if (enemy) {
      ctx.fillStyle = "#800080"; // Purple
      ctx.beginPath();
      ctx.arc(enemy.x + scale / 2, enemy.y + scale / 2, scale / 2 - 2, 0, 2 * Math.PI);
      ctx.fill();

      if (snake.x === enemy.x && snake.y === enemy.y) {
        enemy = null;
        score = Math.max(0, score - 2);
        updateScore();
      }
    }

    // Enemy snake
    if (enemySnake) {
      // Random movement
      if (Math.random() < 0.05) {
        const dirs = [
          { x: 1, y: 0 }, { x: -1, y: 0 },
          { x: 0, y: 1 }, { x: 0, y: -1 }
        ];
        enemySnakeDir = dirs[Math.floor(Math.random() * dirs.length)];
      }

      enemySnake.trail.push({ x: enemySnake.x, y: enemySnake.y });
      while (enemySnake.trail.length > enemySnake.length) {
        enemySnake.trail.shift();
      }

      enemySnake.x += enemySnakeDir.x * scale;
      enemySnake.y += enemySnakeDir.y * scale;

      // Wrap edges
      if (enemySnake.x >= canvas.width) enemySnake.x = 0;
      if (enemySnake.x < 0) enemySnake.x = canvas.width - scale;
      if (enemySnake.y >= canvas.height) enemySnake.y = 0;
      if (enemySnake.y < 0) enemySnake.y = canvas.height - scale;

      // Draw enemy snake
      ctx.fillStyle = "#ff69b4"; // Pink
      for (let segment of enemySnake.trail) {
        drawRoundedRect(ctx, segment.x, segment.y, scale, scale, 5);
      }

      // If player hits enemy snake
      for (let segment of enemySnake.trail) {
        if (snake.x === segment.x && snake.y === segment.y) {
          deadSound.play();
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('highScore', highScore);
          }
          localStorage.setItem('lastScore', score);
          snake.total = 0;
          snake.tail = [];
          score = 0;
          updateScore();
          showGameOver();
          return;
        }
      }

      // If enemy snake hits player (head or tail)
      for (let i = -1; i < snake.tail.length; i++) {
        const segment = i === -1 ? { x: snake.x, y: snake.y } : snake.tail[i];
        if (enemySnake.x === segment.x && enemySnake.y === segment.y) {
          deadSound.play();
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('highScore', highScore);
          }
          localStorage.setItem('lastScore', score);
          snake.total = 0;
          snake.tail = [];
          score = 0;
          updateScore();
          showGameOver();
          return;
        }
      }
    }

    // Snake hits itself
    snake.checkCollision();
  };

  window.addEventListener("keydown", (e) => {
  const direction = e.key.replace("Arrow", "");
  if (snake) {
    snake.changeDirection(direction);
    try { clickSound.play(); } catch (e) { console.log("Key sound failed", e); }
  }
});
  

  function goHome() {
  document.getElementById('game-container').style.display = 'none';
  document.getElementById('homepage').style.display = 'flex';
  document.getElementById('top-title').style.display = 'block';
}
  document.getElementById('theme-toggle').addEventListener('click', () => {
  window.open('https://maddshiidrecords.netlify.app', '_blank');
});
  </script>
